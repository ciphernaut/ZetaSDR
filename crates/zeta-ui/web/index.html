<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZetaSDR</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div id="login" hidden>
  <form id="login-form" autocomplete="off">
    <h1>ZetaSDR</h1>
    <label for="secret">Node secret</label>
    <input id="secret" type="password" spellcheck="false" autocomplete="current-password">
    <button id="connect" type="submit">Connect</button>
    <div id="login-error" role="alert"></div>
  </form>
</div>
<div id="app" hidden>
  <header id="top">
    <span class="brand">ZetaSDR</span>
    <nav id="tabs" role="tablist" aria-label="Sources"></nav>
    <nav id="panes" role="tablist" aria-label="Panes"></nav>
    <button id="listen-all" type="button" aria-pressed="false" title="mix every channel into one audio stream">Listen to all</button>
    <button id="map-toggle" type="button" aria-pressed="false" title="show the map">map</button>
    <button id="drawer-toggle" type="button" aria-label="Transcript and jobs">☰</button>
  </header>
  <main id="main"><div id="waterfall"></div><div id="map" hidden></div><div id="pane" hidden><div id="subjects" hidden></div><div id="explore" hidden></div></div></main>
  <aside id="side">
    <section class="pane transcript">
      <h2>Transcript</h2>
      <div id="transcript" aria-live="polite"></div>
    </section>
    <section class="pane jobs">
      <h2>Jobs</h2>
      <div id="jobs"></div>
    </section>
  </aside>
  <footer id="bar">
    <span class="prompt">›</span>
    <input id="cmd" type="text" spellcheck="false" autocomplete="off"
           placeholder='ask, or an op as JSON: {"op":"source_list"}  (Ctrl-K)'>
    <button id="mic" type="button" disabled aria-pressed="false"
            title="voice input (local speech daemon)"><span class="dot"></span>mic</button>
    <span id="mic-status" role="status"></span>
  </footer>
</div>
</body>
</html>
