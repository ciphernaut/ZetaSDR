[package]
name = "zeta-speech"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Speech-to-text backends for a ZetaSDR node"

[features]
test-fake = []

[dependencies]
async-trait = "0.1.92"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["fs", "net", "io-util", "time", "sync", "rt", "macros"] }
tokio-util = "0.7.20"
ulid = "3.0.0"
zeta-client = { path = "../zeta-client" }
zeta-core = { path = "../zeta-core" }
zeta-dsp = { path = "../zeta-dsp" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
zeta-dsp = { path = "../zeta-dsp", features = ["test-fixtures"] }
zeta-speech = { path = ".", features = ["test-fake"] }
zeta-ws = { path = "../zeta-ws", features = ["test-server"] }
