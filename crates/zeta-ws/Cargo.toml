[package]
name = "zeta-ws"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebSocket transport for a ZetaSDR node"

[features]
test-server = ["zeta-source-file/test-fixtures"]

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["net", "rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7.20"
zeta-client = { path = "../zeta-client" }
zeta-core = { path = "../zeta-core" }
zeta-source-file = { path = "../zeta-source-file", optional = true }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
zeta-ws = { path = ".", features = ["test-server"] }
