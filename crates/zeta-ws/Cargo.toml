[package]
name = "zeta-ws"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebSocket transport for a ZetaSDR node"

[features]
test-server = ["zeta-source-file/test-fixtures"]

[dependencies]
base64 = "0.22"
axum = { version = "0.8.9", features = ["ws"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["fs", "net", "io-util", "rt-multi-thread", "macros", "time", "sync"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
ulid = "3.0.0"
zeta-agent = { path = "../zeta-agent" }
zeta-client = { path = "../zeta-client" }
zeta-core = { path = "../zeta-core" }
zeta-source-file = { path = "../zeta-source-file", optional = true }
zeta-ui = { path = "../zeta-ui" }
zeta-vrt = { path = "../zeta-vrt" }

[dev-dependencies]
futures-util = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
zeta-agent = { path = "../zeta-agent", features = ["test-fake"] }
zeta-ws = { path = ".", features = ["test-server"] }
