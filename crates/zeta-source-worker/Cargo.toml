[package]
name = "zeta-source-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZetaSDR source worker: a port served over stdin/stdout from a child process"

[[bin]]
name = "zeta-fake-worker"
required-features = ["test-bin"]

[dependencies]
async-trait = "0.1.92"
libc = "0.2.191"
num-complex = "0.4.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
zeta-core = { path = "../zeta-core" }
zeta-source-file = { path = "../zeta-source-file", optional = true }
zeta-source-soapy = { path = "../zeta-source-soapy", optional = true }

[features]
# The `zeta-fake-worker` test binary: `serve` over a scripted mock device or a
# SigMF recording, for the supervisor and node tests.
test-bin = ["dep:zeta-source-soapy", "zeta-source-soapy/test-mock", "dep:zeta-source-file", "zeta-source-file/test-fixtures"]

[dev-dependencies]
tempfile = "3.27.0"
zeta-core = { path = "../zeta-core", features = ["test-fixtures"] }
zeta-dsp = { path = "../zeta-dsp" }
zeta-source-file = { path = "../zeta-source-file", features = ["test-fixtures"] }
zeta-source-worker = { path = ".", features = ["test-bin"] }
