[package]
name = "zeta-source-file"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZetaSDR file-based IQ source"

[dependencies]
async-trait = "0.1.92"
num-complex = "0.4.6"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["sync", "rt", "time", "macros", "rt-multi-thread"] }
zeta-core = { path = "../zeta-core" }

[dev-dependencies]
tempfile = "3.27.0"

[features]
test-fixtures = []

[dev-dependencies.zeta-source-file]
path = "."
features = ["test-fixtures"]
