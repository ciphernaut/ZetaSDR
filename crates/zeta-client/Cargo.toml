[package]
name = "zeta-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Typed client for a ZetaSDR node"

[dependencies]
futures-util = "0.3"
num-complex = "0.4.6"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["net", "time"] }
tokio-tungstenite = "0.30.0"
zeta-core = { path = "../zeta-core" }
zeta-vrt = { path = "../zeta-vrt" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
zeta-ws = { path = "../zeta-ws", features = ["test-server"] }
