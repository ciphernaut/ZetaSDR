[package]
name = "zeta-source-soapy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZetaSDR SoapySDR hardware source"

[dependencies]
async-trait = "0.1.92"
num-complex = "0.4.6"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["sync", "time", "rt"] }
zeta-core = { path = "../zeta-core" }

[features]
# No `driver` feature here: `cargo --workspace --all-features` would enable it and
# soapysdr-sys cannot build without libsoapysdr-dev. See Task 11 notes.
test-mock = []

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }

[dev-dependencies.zeta-source-soapy]
path = "."
features = ["test-mock"]
