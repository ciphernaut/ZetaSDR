[package]
name = "zeta-ext"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZetaSDR stages backed by external decoder programs (dump1090)"

[dependencies]
async-trait = "0.1.92"
num-complex = "0.4.6"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["process", "io-util", "net", "sync", "rt", "macros", "time"] }
tokio-util = "0.7.20"
zeta-core = { path = "../zeta-core" }
zeta-dsp = { path = "../zeta-dsp" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }
zeta-dsp = { path = "../zeta-dsp", features = ["test-fixtures"] }
