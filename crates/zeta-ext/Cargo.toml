[package]
name = "zeta-ext"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
publish = false
keywords = ["sdr", "radio", "dsp"]
categories = ["science"]
description = "ZetaSDR stages backed by external decoder programs (external_decode, adsb_decode)"

[features]
# The register stub other crates' tests run (`testing::acma_stub`).
test-fake = ["dep:axum"]

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", optional = true }
num-complex = "0.4.6"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["process", "io-util", "net", "sync", "rt", "macros", "time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio-util = "0.7.20"
zeta-core = { path = "../zeta-core" }
zeta-dsp = { path = "../zeta-dsp" }
zeta-plugin = { path = "../zeta-plugin" }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }
zeta-dsp = { path = "../zeta-dsp", features = ["test-fixtures"] }
zeta-ext = { path = ".", features = ["test-fake"] }
