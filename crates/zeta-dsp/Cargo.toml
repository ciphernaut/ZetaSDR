[package]
name = "zeta-dsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZetaSDR DSP stages"

[dependencies]
async-trait = "0.1.92"
num-complex = "0.4.6"
rustfft = "6.4.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["sync", "rt", "macros", "time"] }
tokio-util = "0.7.20"
zeta-core = { path = "../zeta-core" }

[dev-dependencies]
tempfile = "3.27.0"
zeta-source-file = { path = "../zeta-source-file", features = ["test-fixtures"] }

[features]
test-fixtures = []

[[example]]
name = "gen_aprs"
required-features = ["test-fixtures"]
