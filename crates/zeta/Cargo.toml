[package]
name = "zeta"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
publish = false
keywords = ["sdr", "radio", "dsp"]
categories = ["command-line-utilities"]
description = "ZetaSDR command-line node"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["io-std", "io-util", "rt-multi-thread", "macros", "signal", "time"] }
zeta-core = { path = "../zeta-core" }
zeta-client = { path = "../zeta-client" }
zeta-ws = { path = "../zeta-ws" }
zeta-speech = { path = "../zeta-speech" }
tokio-util = "0.7.20"
zeta-dsp = { path = "../zeta-dsp" }
zeta-source-file = { version = "0.1.0", path = "../zeta-source-file" }
zeta-agent = { path = "../zeta-agent" }
zeta-source-kiwi = { path = "../zeta-source-kiwi" }
zeta-source-node = { path = "../zeta-source-node" }
zeta-source-vrt = { path = "../zeta-source-vrt" }
zeta-plugin = { path = "../zeta-plugin" }
zeta-ext = { path = "../zeta-ext" }
zeta-source-worker = { path = "../zeta-source-worker" }
zeta-vrt = { path = "../zeta-vrt" }

# The real SoapySDR driver links libSoapySDR (needs libsoapysdr-dev), so it is
# behind a cfg, not a feature: `--all-features` must never build it. Build with
# RUSTFLAGS="--cfg soapy" cargo build -p zeta --release
[target.'cfg(soapy)'.dependencies]
zeta-source-soapy-driver = { path = "../zeta-source-soapy-driver" }
# The worker's own pieces: zeta's gain=/ppm= split, and prctl for the parent-death signal.
zeta-source-soapy = { path = "../zeta-source-soapy" }
libc = "0.2.191"

[features]
gpu = ["zeta-dsp/gpu"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(soapy)'] }

[dev-dependencies]
assert_cmd = "2.2.2"
zeta-ws = { path = "../zeta-ws", features = ["test-server"] }
num-complex = "0.4.6"
predicates = "3.1.4"
tempfile = "3.27.0"
zeta-client = { path = "../zeta-client" }
zeta-dsp = { path = "../zeta-dsp", features = ["test-fixtures"] }
zeta-speech = { path = "../zeta-speech", features = ["test-fake"] }
zeta-source-file = { path = "../zeta-source-file", features = ["test-fixtures"] }
zeta-agent = { path = "../zeta-agent", features = ["test-fake"] }
zeta-source-kiwi = { path = "../zeta-source-kiwi", features = ["test-fake"] }
zeta-ext = { path = "../zeta-ext", features = ["test-fake"] }
