[package]
name = "zeta"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZetaSDR command-line node"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "time"] }
zeta-core = { path = "../zeta-core" }
zeta-dsp = { path = "../zeta-dsp" }
zeta-source-file = { version = "0.1.0", path = "../zeta-source-file" }

[features]
gpu = ["zeta-dsp/gpu"]

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
zeta-dsp = { path = "../zeta-dsp", features = ["test-fixtures"] }
zeta-source-file = { path = "../zeta-source-file", features = ["test-fixtures"] }
