[package]
name = "zeta-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "External-process stages for ZetaSDR: the stdio plugin protocol"

[dependencies]
num-complex = "0.4.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["io-util"] }
zeta-core = { path = "../zeta-core" }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["io-util", "macros", "rt"] }
zeta-ws = { path = "../zeta-ws" }
