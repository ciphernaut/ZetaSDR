[package]
name = "zeta-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
publish = false
keywords = ["sdr", "radio", "dsp"]
categories = ["science"]
description = "ZetaSDR core runtime types"

[dependencies]
async-trait = "0.1.92"
jsonschema = { version = "0.59.0", default-features = false }
num-complex = "0.4.6"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["sync", "rt", "macros", "rt-multi-thread", "time"] }
tokio-util = "0.7.20"
ulid = "3.0.0"

[dev-dependencies]
tempfile = "3.27.0"
zeta-dsp = { path = "../zeta-dsp" }
zeta-source-file = { path = "../zeta-source-file", features = ["test-fixtures"] }

[features]
test-fixtures = []

[[test]]
name = "transcripts_log"
required-features = ["test-fixtures"]

[[test]]
name = "identify"
required-features = ["test-fixtures"]

[[test]]
name = "watch"
required-features = ["test-fixtures"]
