<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 664" width="1440" height="664" role="img" aria-label="How a model drives the node: a configured LLM proposes calls that zeta-agent executes behind an allowance gate; an external coding agent runs its own loop and reaches the node through zeta-mcp, the CLI or raw HTTP with no gate, or hands the request to the node's own agent through POST /ask." font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="currentColor" style="color:#1b1f24">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker>
<marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 10 0 L 0 5 L 10 10 z" fill="currentColor"/></marker>
</defs>
<rect x="0" y="0" width="1440" height="664" fill="#fbfbf9"/>
<text x="18" y="32" font-size="22" text-anchor="start" opacity="1" font-weight="700">How a model drives the node</text>
<text x="330" y="32" font-size="12" text-anchor="start" opacity="0.8">who runs the loop (A: zeta, B: the agent), the doors in, what can refuse a call, and how the ops log records it</text>
<rect x="20" y="58" width="680" height="470" rx="10" fill="currentColor" fill-opacity="0.025"/>
<text x="34" y="80" font-size="13" text-anchor="start" opacity="1" font-weight="700">A. A configured LLM: zeta runs the loop</text>
<text x="34" y="96" font-size="10.5" text-anchor="start" opacity="0.75" font-style="italic">POST /ask (the page's agent pane) or zeta ask; the model only proposes calls</text>
<rect x="740" y="58" width="680" height="470" rx="10" fill="currentColor" fill-opacity="0.025"/>
<text x="754" y="80" font-size="13" text-anchor="start" opacity="1" font-weight="700">B. An external coding agent (Claude Code): the agent runs the loop</text>
<text x="754" y="96" font-size="10.5" text-anchor="start" opacity="0.75" font-style="italic">four doors: MCP, the CLI, raw HTTP, or handing the request to the node's own agent</text>
<rect x="40" y="110" width="640" height="54" rx="7" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
<text x="49" y="128" font-size="12.5" font-weight="700">Operator</text>
<text x="49" y="145" font-size="10.5">
<tspan x="49" dy="0">types a request in the page's agent pane, or runs zeta ask "REQUEST" (stdin works: a voice transcript piped in).</tspan>
</text>
<rect x="40" y="196" width="350" height="150" rx="7" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
<text x="49" y="214" font-size="12.5" font-weight="700">zeta-agent: the tool loop</text>
<rect x="331.4" y="202" width="51.599999999999994" height="15" rx="7.5" fill="#7c3aed"/>
<text x="357.2" y="213" font-size="9" font-weight="700" letter-spacing="0.06em" text-anchor="middle" fill="#ffffff">EITHER</text>
<text x="49" y="231" font-size="10.2">
<tspan x="49" dy="0">Runs inside zeta serve for POST /ask, inside the zeta process</tspan>
<tspan x="49" dy="12.7">for zeta ask. Builds the tool list and guide from the schema</tspan>
<tspan x="49" dy="12.7">and AGENTS.md, sends them with the transcript, executes each</tspan>
<tspan x="49" dy="12.7">call it gets back, appends the result, repeats up to</tspan>
<tspan x="49" dy="12.7">max_turns (1-32, default 8). Results trimmed for a small</tspan>
<tspan x="49" dy="12.7">model (job_list without graphs, the newest 20 captures).</tspan>
</text>
<rect x="480" y="196" width="200" height="150" rx="7" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
<text x="489" y="214" font-size="12.5" font-weight="700">LLM server</text>
<rect x="621.4" y="202" width="51.599999999999994" height="15" rx="7.5" fill="#7c3aed"/>
<text x="647.2" y="213" font-size="9" font-weight="700" letter-spacing="0.06em" text-anchor="middle" fill="#ffffff">EITHER</text>
<text x="489" y="231" font-size="10.2">
<tspan x="489" dy="0">Any OpenAI-compatible server</tspan>
<tspan x="489" dy="12.7">(llama.cpp, vLLM, a gateway). Sees</tspan>
<tspan x="489" dy="12.7">text only: never the node, the</tspan>
<tspan x="489" dy="12.7">secret or the radios. Answers one</tspan>
<tspan x="489" dy="12.7">tool call per turn, or the final</tspan>
<tspan x="489" dy="12.7">prose.</tspan>
</text>
<path d="M 390 236 L 480 236" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="435" y="229" font-size="9.5" text-anchor="middle" opacity="0.85">tools, transcript</text>
<path d="M 480 300 L 390 300" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="435" y="315" font-size="9.5" text-anchor="middle" opacity="0.85">one tool call</text>
<path d="M 215 164 L 215 196" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="40" y="376" width="640" height="96" rx="7" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
<text x="49" y="394" font-size="12.5" font-weight="700">The allowance gate (in the loop, before the node)</text>
<text x="49" y="411" font-size="10.2">
<tspan x="49" dy="0">job_stop, jobs_stop, a non-empty replace and capture_delete come back to the model as not_allowed unless the run</tspan>
<tspan x="49" dy="12.7">allows them (allow.stop_jobs / replace / delete_captures, zeta ask --allow-stop / --allow-replace /</tspan>
<tspan x="49" dy="12.7">--allow-delete); jobs this run started itself may be stopped. Code enforces it, not the prompt.</tspan>
</text>
<path d="M 215 346 L 215 376" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="760" y="110" width="640" height="54" rx="7" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
<text x="769" y="128" font-size="12.5" font-weight="700">Operator</text>
<text x="769" y="145" font-size="10.5">
<tspan x="769" dy="0">asks in a terminal or IDE session; approves the agent's tool calls by its own permission settings.</tspan>
</text>
<rect x="760" y="196" width="350" height="150" rx="7" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
<text x="769" y="214" font-size="12.5" font-weight="700">Claude Code (or any MCP-capable agent)</text>
<rect x="1051.4" y="202" width="51.599999999999994" height="15" rx="7.5" fill="#7c3aed"/>
<text x="1077.2" y="213" font-size="9" font-weight="700" letter-spacing="0.06em" text-anchor="middle" fill="#ffffff">EITHER</text>
<text x="769" y="231" font-size="10.2">
<tspan x="769" dy="0">Its own loop on its own host (the node's host or another</tspan>
<tspan x="769" dy="12.7">machine). Reads AGENTS.md as the MCP server's instructions or</tspan>
<tspan x="769" dy="12.7">the skills/zetasdr skill. Gets full results, chains as many</tspan>
<tspan x="769" dy="12.7">calls as it likes, and can also edit code, build, deploy and</tspan>
<tspan x="769" dy="12.7">read logs: things no node op can do.</tspan>
</text>
<rect x="1200" y="196" width="200" height="150" rx="7" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
<text x="1209" y="214" font-size="12.5" font-weight="700">Its model</text>
<rect x="1341.4" y="202" width="51.599999999999994" height="15" rx="7.5" fill="#1d4ed8"/>
<text x="1367.2" y="213" font-size="9" font-weight="700" letter-spacing="0.06em" text-anchor="middle" fill="#ffffff">REMOTE</text>
<text x="1209" y="231" font-size="10.2">
<tspan x="1209" dy="0">Anthropic's API, called by the</tspan>
<tspan x="1209" dy="12.7">agent. The node never talks to it</tspan>
<tspan x="1209" dy="12.7">and never sees its prompts.</tspan>
</text>
<path d="M 1110 236 L 1200 236" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="1155" y="229" font-size="9.5" text-anchor="middle" opacity="0.85">prompt</text>
<path d="M 1200 300 L 1110 300" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="1155" y="315" font-size="9.5" text-anchor="middle" opacity="0.85">tool calls</text>
<path d="M 935 164 L 935 196" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="760" y="376" width="148" height="134" rx="7" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
<text x="769" y="394" font-size="12.5" font-weight="700">1. zeta-mcp</text>
<text x="769" y="411" font-size="9.8">
<tspan x="769" dy="0">stdio MCP server beside</tspan>
<tspan x="769" dy="12.3">the agent: one tool per</tspan>
<tspan x="769" dy="12.3">op from GET /schema,</tspan>
<tspan x="769" dy="12.3">AGENTS.md as its</tspan>
<tspan x="769" dy="12.3">instructions.</tspan>
</text>
<rect x="924" y="376" width="148" height="134" rx="7" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
<text x="933" y="394" font-size="12.5" font-weight="700">2. zeta CLI</text>
<text x="933" y="411" font-size="9.8">
<tspan x="933" dy="0">zeta --node URL with</tspan>
<tspan x="933" dy="12.3">ZETA_SECRET (ZETA_NODE</tspan>
<tspan x="933" dy="12.3">works too). Without</tspan>
<tspan x="933" dy="12.3">--node a one-shot opens</tspan>
<tspan x="933" dy="12.3">the node in-process, only</tspan>
<tspan x="933" dy="12.3">while no serve owns the</tspan>
<tspan x="933" dy="12.3">state dir.</tspan>
</text>
<rect x="1088" y="376" width="148" height="134" rx="7" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
<text x="1097" y="394" font-size="12.5" font-weight="700">3. Raw HTTP + ws</text>
<text x="1097" y="411" font-size="9.8">
<tspan x="1097" dy="0">curl, cb_watch.py, any</tspan>
<tspan x="1097" dy="12.3">language: POST /op, GET</tspan>
<tspan x="1097" dy="12.3">/schema, /agents-md,</tspan>
<tspan x="1097" dy="12.3">/streams/{id}/tail, ws</tspan>
<tspan x="1097" dy="12.3">/stream/{id}. The page is</tspan>
<tspan x="1097" dy="12.3">one such client.</tspan>
</text>
<rect x="1252" y="376" width="148" height="134" rx="7" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.2"/>
<text x="1261" y="394" font-size="12.5" font-weight="700">4. POST /ask</text>
<text x="1261" y="411" font-size="9.8">
<tspan x="1261" dy="0">Hand the request to the</tspan>
<tspan x="1261" dy="12.3">node's own agent: path A</tspan>
<tspan x="1261" dy="12.3">from outside, its LLM,</tspan>
<tspan x="1261" dy="12.3">its turn budget and the</tspan>
<tspan x="1261" dy="12.3">gate (allow in the body).</tspan>
</text>
<path d="M 834 346 L 834 376" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 998 346 L 998 376" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 1100 346 L 1100 361 L 1326 361 L 1326 376" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 1162 361 L 1162 376" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="20" y="556" width="1400" height="92" rx="7" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.8"/>
<text x="29" y="574" font-size="14" font-weight="700">zeta serve: Node::apply(op), the same 36 ops for every route</text>
<rect x="1368.0" y="562" width="45.0" height="15" rx="7.5" fill="#0f766e"/>
<text x="1390.5" y="573" font-size="9" font-weight="700" letter-spacing="0.06em" text-anchor="middle" fill="#ffffff">LOCAL</text>
<text x="29" y="591" font-size="10.5">
<tspan x="29" dy="0">A arrives in-process: POST /ask logs ops as transport agent; zeta ask logs local (one-shot) or http (with --node), not agent. B's doors 1-3 arrive over HTTP /op and log http (ui when the caller sends X-Zeta-Client: ui, a label it chooses, not a</tspan>
<tspan x="29" dy="13.0">credential): the log cannot tell Claude Code from curl, nor which request caused a call. Door 4 runs path A inside the node, gate included. Over HTTP the bearer is the whole of the authority: no gate refuses a job_stop or replace sent through doors</tspan>
<tspan x="29" dy="13.0">1-3. The guide's rules (stop only what the request names or you started) bind B only as instructions it follows, and the operator's approval of its tool calls.</tspan>
</text>
<path d="M 215 472 L 215 556" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="223" y="520" font-size="10" text-anchor="start" opacity="0.85">in-process executor (HTTP with zeta ask --node)</text>
<path d="M 834.0 510 L 834.0 556" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="839.0" y="536" font-size="9.2" text-anchor="start" opacity="0.85">POST /op: http</text>
<path d="M 998.0 510 L 998.0 556" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="1003.0" y="536" font-size="9.2" text-anchor="start" opacity="0.85">POST /op: http (one-shot: local)</text>
<path d="M 1162.0 510 L 1162.0 556" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="1167.0" y="536" font-size="9.2" text-anchor="start" opacity="0.85">POST /op: http (ui by header)</text>
<path d="M 1326.0 510 L 1326.0 556" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="1331.0" y="536" font-size="9.2" text-anchor="start" opacity="0.85">runs path A: agent</text>
</svg>