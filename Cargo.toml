[workspace]
members = ["crates/*"]
# Links libSoapySDR (needs libsoapysdr-dev); built on its own, see its README.
exclude = ["crates/zeta-source-soapy-driver"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ciphernaut/ZetaSDR"
homepage = "https://github.com/ciphernaut/ZetaSDR"
readme = "README.md"
authors = ["Sage Grigull <ciphernaut@proton.me>"]

# The e2e and DSP tests run debug builds; unoptimised FFTs dominate their time.
[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.num-complex]
opt-level = 3

# Tests run sources in real time through debug builds: unoptimised, a wfm_demod and
# transcribe chain at 240 kHz (channel, wfm_demod, nnnoiseless denoise) costs about 1.3
# CPU-seconds per second and falls behind real time on a loaded host; optimised, 0.13.
[profile.dev.package.zeta-dsp]
opt-level = 3

[profile.dev.package.nnnoiseless]
opt-level = 3

# The video websocket scales and PNG-encodes every field it sends: unoptimised, a 360 x 288
# smooth field costs about 20 ms (a core at 50 fields a second); optimised, about 1 ms.
[profile.dev.package.zeta-vrt]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3
