title = "ZetaSDR gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "documented placeholders and test fixtures"
paths = [
  '''(^|/)s3cret''',
]
regexes = [
  '''ui-secret-0123456789''',
]

# Observations that locate the station. A frequency beside a distance, or a distance
# beside a bearing, taken from a live observation of a fixed site triangulates the
# receiver: keep such data in git-ignored scratch, never in tracked files. Names of
# sensitive infrastructure (licensees, sites) belong in the private public-denylist,
# not here, since this file is public. Synthetic example rows ("Example ..."), the page
# tests' fixed display formats and radiosondes (transient, published by SondeHub) are
# allowed.
[[rules]]
id = "observed-frequency-with-distance"
description = "a frequency next to a distance in km (a site's frequency and range from the station)"
regex = '''(?i)\b\d{2,5}\.\d{1,6}\s?MHz\b[^\n]{0,80}?\b\d{1,4}(?:\.\d+)?\s?km\b'''
keywords = ["mhz"]
[[rules.allowlists]]
regexTarget = "line"
regexes = ['''Example [A-Z]''', '''(?i)sonde|rs41|km up|up and descending''']

[[rules]]
id = "observed-distance-with-bearing"
description = "a distance in km next to a bearing in degrees (a site's position relative to the station)"
regex = '''(?i)\b\d{1,4}(?:\.\d+)?\s?km\b[^\n]{0,12}?\b\d{1,3}(?:\.\d+)?\s?(?:°|deg\b)'''
keywords = ["km"]
[[rules.allowlists]]
paths = ['''crates/zeta-ui/tests/e2e/ui\.py''', '''docs/superpowers/plans/2026-11-02-subjects\.md''', '''crates/zeta-ui/web/agent\.js''']
