name: ci

# Pushes and manual runs only: pull requests are not accepted at this stage.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info in CI builds: the workspace's test binaries with full debug info
  # crashed the linker on a hosted runner (bus error while linking zeta and zeta-mcp).
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt
      # Per member: zeta-source-soapy-driver is outside the workspace and links libSoapySDR.
      - name: cargo fmt per member
        run: |
          for d in crates/*/; do
            name=$(basename "$d")
            [ "$name" = zeta-source-soapy-driver ] && continue
            cargo fmt -p "$name" -- --check
          done

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk (toolchains this build does not use)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The web page end to end has its own job (ui), which fails if it skips.
      - run: cargo test --workspace -- --skip ui_scenarios_pass_in_headless_chromium

  ui:
    runs-on: ubuntu-24.04
    # A normal run takes about 15 minutes (the suite alone about 9). Chromium's system
    # packages come from the runner's Ubuntu mirror, which once took 10 minutes for 20 MB:
    # the margin absorbs that and still stops a hung suite long before GitHub's 6 hours.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk (toolchains this build does not use)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Playwright and Chromium
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" playwright==1.64.1
          "$RUNNER_TEMP/venv/bin/python" -m playwright install --with-deps chromium
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: UI end to end (fails if it skipped)
        run: |
          set -o pipefail
          cargo test -p zeta --test ui -- --nocapture 2>&1 | tee ui.log
          if grep -q 'ui e2e skipped:' ui.log; then
            echo "::error::the UI e2e skipped instead of running"
            exit 1
          fi

  agents-md:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo run -q -p zeta -- agents-md --check
      - run: cargo run -q -p zeta -- agents-md --skill --check

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources

  public-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The scanner binary from its release, checked against the published checksum.
      # No private denylist exists in CI: the built-in checks only.
      - name: Install the leak scanner
        run: |
          v=8.30.1
          f="gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${v}/$f"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: bash scripts/tests/public-check.sh
      - run: bash scripts/public-check.sh

  # The export's own tests (fixture repositories, cargo gates skipped): the
  # history rewrite needs git-filter-repo, the gates the leak scanner.
  export-public:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install git-filter-repo
        run: |
          uv tool install git-filter-repo==2.47.0
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Install the leak scanner
        run: |
          v=8.30.1
          f="gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${v}/$f"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: bash scripts/tests/export-public.sh

  doc-links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/tests/check-doc-links.sh
      - run: bash scripts/check-doc-links.sh
