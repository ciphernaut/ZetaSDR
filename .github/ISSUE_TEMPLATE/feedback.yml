name: Feedback
description: Something you tried, and what happened.
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying ZetaSDR. Leave out secrets, your exact position and host names you would rather not publish.
        For a security problem, use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: The command or operation, exactly as you ran it, and the source kind (a recording, a SoapySDR device and which one, a KiwiSDR, another node).
      render: shell
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The JSON it printed, and anything from the node's stderr that looks related.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: "`zeta --version`, or `git rev-parse --short HEAD`."
    validations:
      required: false
